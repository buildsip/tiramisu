<!--
  The same workspace appears twice. Search runs from acme-app/apps/api.
  Green memory files are searched; gray memory files belong to sibling apps.
  The team memory is included because availableToWorkspace is enabled.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="924" viewBox="0 0 1020 924" role="img" aria-labelledby="title desc">
  <title id="title">Which memory files search checks</title>
