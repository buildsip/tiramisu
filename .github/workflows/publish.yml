name: Publish

# A tag push runs the copy of this file stored in that commit.
# The "Protect release tags" ruleset lets only repository admins create v*.*.* tags.
#
# verify builds the tarball and has no publish permission.
# publish uploads that tarball. It does not install dependencies.
# release only creates the GitHub release.

on:
  push:
    tags:
      - "v*.*.*"

# Read-only for every job. Publish and release opt into what they need.
permissions:
  contents: read

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Download main and require the tagged commit to be part of it.
      # This applies to this copy of the file. The tag ruleset is what blocks a different copy.
      - name: Check tag points at main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "Tag ${GITHUB_REF_NAME} does not point at a commit on main."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          # This build produces the published tarball. Do not restore an Actions cache into it.
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check tag matches package version
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")

          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match packages/cli/package.json version ${version}."
            exit 1
          fi

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build CLI
        run: bun run build

      # prepack builds again and copies the README into the tarball.
      # The publish job uploads this file and does not run those scripts.
      - name: Pack CLI
        working-directory: packages/cli
        run: |
          filename=$(npm pack --json | jq -r '.[0].filename')
          if [ -z "$filename" ] || [ "$filename" = "null" ]; then
            echo "npm pack did not return a tarball name."
            exit 1
          fi
          echo "$filename" > pack-filename.txt

      - name: Upload package tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-package
          path: |
            packages/cli/*.tgz
            packages/cli/pack-filename.txt
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # id-token: sign the npm publish. This job does not install dependencies.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download package tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-package
          path: packaged

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Publish to npm
        run: |
          filename=$(cat packaged/pack-filename.txt)
          npm publish "./packaged/${filename}" --provenance --access public

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents: create the GitHub release.
    permissions:
      contents: write

    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "GitHub Release ${GITHUB_REF_NAME} already exists."
          else
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          fi
