# Create the GitHub prod environment and restrict deployments to main.
# Add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN to that environment's secrets.
name: Deploy docs to prod

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "docs/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - ".bun-version"
      - ".github/workflows/deploy-docs-prod.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docs-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy docs Worker
    # A hand-started run from another branch must not deploy.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # Do not restore dependency caches into a job with production credentials.
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          # This job has production credentials. Do not restore an Actions cache into it.
          no-cache: true

      # Install all workspaces from the root lockfile. Fail if any manifest disagrees.
      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Check lockfile
        working-directory: .
        run: git diff --exit-code -- bun.lock

      - name: Lint
        run: bun run lint

      - name: Deploy Worker
        # The production build checks TypeScript before uploading the Worker.
        # Credentials are available only in this step.
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Next inlines this at build time. Pull-request builds leave it unset.
          NEXT_PUBLIC_ENV: production
        run: |
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Add $name to the GitHub prod environment secrets, then rerun this workflow."
              exit 1
            fi
          done
          bun run deploy
