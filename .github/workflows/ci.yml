# Check packages on pull requests and pushes to main; publishing repeats those checks.
# Check docs on pull requests; the deployment workflow checks them on main.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Check docs Worker
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # All workspaces share the root lockfile; the docs build needs no production credentials.
      - name: Install dependencies
        working-directory: .
        run: bun install

      - name: Check lockfile
        working-directory: .
        run: git diff --exit-code -- bun.lock

      - name: Lint
        run: bun run lint

      # Next.js checks TypeScript during the production build.
      - name: Validate Cloudflare build
        run: bun run deploy:dry

  check:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Audit every workspace, including CLI dependencies and docs development tools.
      - name: Audit dependencies
        run: bun run audit

      # Docs have their own lint step in PR checks and main deployments.
      # Keep this exclusion in CI so local root lint still checks the whole repo.
      - name: Lint
        run: bun run lint --ignore-pattern 'apps/docs/**'

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
